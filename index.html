<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Budapest">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=IBM+Plex+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<title>Budapest — אריאל ואלה</title>
<style>
:root{--black:#080808;--white:#f4f1eb;--gold:#c9a84c;--gold2:#e8c96a;--g1:#111;--g2:#181818;--g3:#222;--g4:#333;--g5:#5a5a5a;--g6:#888;--serif:'Cormorant Garamond',Georgia,serif;--mono:'IBM Plex Mono',monospace;--sans:'DM Sans',sans-serif;--ease:cubic-bezier(0.16,1,0.3,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--black);color:var(--white);min-height:100dvh;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body::after{content:'';position:fixed;inset:0;z-index:9900;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px}

/* LOADER */
#loader{position:fixed;inset:0;z-index:9000;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s var(--ease),visibility .9s}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
.ld-flag{font-size:42px;animation:fu .8s var(--ease) .1s both}
.ld-eyebrow{font-family:var(--mono);font-size:8px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin:18px 0 10px;animation:fu .8s var(--ease) .3s both}
.ld-title{font-family:var(--serif);font-size:clamp(52px,18vw,88px);font-weight:300;line-height:.88;text-align:center;animation:fu .8s var(--ease) .45s both}
.ld-title em{display:block;font-style:italic;color:var(--gold);font-size:.38em;letter-spacing:8px;margin-top:12px}
.ld-rule{width:0;height:.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px 0 14px;animation:ruleW 1s var(--ease) .75s both}
.ld-names{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--g6);animation:fu .8s var(--ease) .9s both}
.ld-prog-wrap{width:120px;height:1px;background:var(--g3);margin-top:22px;overflow:hidden;border-radius:1px;animation:fu .5s var(--ease) 1s both}
.ld-prog{height:100%;width:0;background:var(--gold);animation:progFill 1.8s var(--ease) 1.1s both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes ruleW{from{width:0}to{width:100px}}
@keyframes progFill{from{width:0}to{width:100%}}

/* APP */
#app{display:none;padding-bottom:76px}
#app.visible{display:block}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:600;height:54px;background:rgba(8,8,8,.95);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-bottom:.5px solid rgba(201,168,76,.14);display:flex;align-items:center;padding:0 16px;gap:10px}
.tb-logo{font-family:var(--serif);font-size:19px;font-weight:400;flex:1}
.tb-logo span{color:var(--gold);font-style:italic}
.tb-wpill{font-family:var(--mono);font-size:9px;color:var(--g6);background:var(--g2);border:.5px solid var(--g3);border-radius:20px;padding:4px 10px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tb-days{display:flex;gap:5px}
.tb-d{width:28px;height:28px;border-radius:50%;border:.5px solid var(--g4);background:transparent;color:var(--g5);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-d.active{background:var(--gold);border-color:var(--gold);color:var(--black);font-weight:bold}
.tb-d.has{border-color:var(--g5);color:var(--g6)}

/* HERO */
.hero{padding-top:54px;background:var(--g1);position:relative;overflow:hidden}
.hero-ghost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:clamp(90px,32vw,200px);font-weight:600;font-style:italic;color:rgba(201,168,76,.04);white-space:nowrap;pointer-events:none;user-select:none;letter-spacing:-3px}
.hero-body{position:relative;padding:28px 20px 22px}
.hero-kicker{font-family:var(--mono);font-size:8px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.hero-h1{font-family:var(--serif);font-size:clamp(36px,12vw,58px);font-weight:300;line-height:.9;margin-bottom:10px}
.hero-h1 em{font-style:italic;color:var(--gold)}
.hero-byline{font-family:var(--mono);font-size:9px;color:var(--g5);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero-rule{width:14px;height:.5px;background:var(--g4)}

/* COUNTDOWN */
.countdown{background:var(--g2);border-top:.5px solid var(--g3);border-bottom:.5px solid var(--g3);padding:16px 20px}
.cd-label{font-family:var(--mono);font-size:8px;letter-spacing:3px;color:var(--g5);text-transform:uppercase;margin-bottom:12px}
.cd-nums{display:flex;align-items:flex-end}
.cd-unit{flex:1;text-align:center}
.cd-n{font-family:var(--serif);font-size:34px;font-weight:300;color:var(--white);line-height:1;transition:color .3s}
.cd-n.tick{color:var(--gold)}
.cd-u{font-family:var(--mono);font-size:7px;letter-spacing:2px;color:var(--g5);text-transform:uppercase;margin-top:3px}
.cd-col{font-family:var(--serif);font-size:26px;color:var(--g4);padding:0 2px;margin-bottom:10px;animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.cd-active{font-family:var(--serif);font-size:17px;font-style:italic;color:var(--gold);text-align:center;padding:16px 20px;background:var(--g2);border-top:.5px solid var(--g3);border-bottom:.5px solid var(--g3)}

/* TRIP PROGRESS */
.trip-prog{padding:16px 20px;background:var(--black)}
.tp-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--g5);text-transform:uppercase;margin-bottom:8px}
.tp-track{height:1.5px;background:var(--g3);border-radius:2px;overflow:hidden}
.tp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 1.2s var(--ease)}
.tp-dates{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--mono);font-size:8px;color:var(--g4)}

/* WEATHER */
.weather-card{margin:16px 20px 0;background:var(--g2);border:.5px solid var(--g3);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px}
.wc-icon{font-size:38px;line-height:1}
.wc-body{flex:1}
.wc-temp{font-family:var(--serif);font-size:34px;font-weight:300;line-height:1}
.wc-desc{font-family:var(--mono);font-size:9px;color:var(--g6);margin-top:3px;letter-spacing:1px}
.wc-right{text-align:left;font-family:var(--mono);font-size:8px;color:var(--g5);line-height:2;letter-spacing:.5px}

/* QUOTE */
.quote-strip{margin:14px 20px 0;padding:16px 16px 16px 20px;border-right:2px solid var(--gold);background:var(--g1)}
.qs-text{font-family:var(--serif);font-size:16px;font-style:italic;font-weight:300;line-height:1.6;color:var(--white)}
.qs-author{font-family:var(--mono);font-size:8px;color:var(--g5);letter-spacing:2px;text-transform:uppercase;margin-top:8px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--g3);border-top:.5px solid var(--g3);border-bottom:.5px solid var(--g3);margin-top:14px}
.stat-cell{background:var(--g1);padding:14px 8px;text-align:center}
.stat-n{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--gold);line-height:1}
.stat-l{font-family:var(--mono);font-size:7px;letter-spacing:2px;color:var(--g5);text-transform:uppercase;margin-top:3px}

/* DAY SECTIONS */
.day-section{display:none}
.day-section.active{display:block}
.day-header{background:var(--g1);padding:24px 20px 18px;border-top:.5px solid var(--g3);position:relative;overflow:hidden}
.dh-ghost{position:absolute;top:50%;right:-8px;transform:translateY(-50%);font-family:var(--serif);font-size:80px;font-weight:600;font-style:italic;color:rgba(201,168,76,.06);pointer-events:none;user-select:none;line-height:1}
.dh-kicker{font-family:var(--mono);font-size:8px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.dh-title{font-family:var(--serif);font-size:clamp(28px,9vw,44px);font-weight:300;line-height:.95;margin-bottom:6px}
.dh-title em{font-style:italic;color:var(--gold)}
.dh-date{font-family:var(--mono);font-size:9px;color:var(--g5)}
.dh-count{font-family:var(--mono);font-size:8px;color:var(--gold);letter-spacing:1px;margin-top:5px}

/* UPLOAD */
.upload-zone{margin:14px 20px;border:.5px dashed var(--g4);border-radius:10px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .18s;background:transparent;position:relative}
.upload-zone:active{border-color:var(--gold);background:rgba(201,168,76,.04)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
.uz-icon{font-size:22px;opacity:.4}
.uz-text{font-family:var(--mono);font-size:10px;color:var(--g5);letter-spacing:.5px;text-align:center}
.uz-text strong{color:var(--gold)}

/* EMPTY STATE */
.empty-state{padding:32px 20px;text-align:center;display:none}
.empty-state.on{display:block}
.es-icon{font-size:40px;opacity:.25;margin-bottom:12px}
.es-title{font-family:var(--serif);font-size:20px;font-weight:300;font-style:italic;color:var(--g6);margin-bottom:6px}
.es-sub{font-family:var(--mono);font-size:9px;color:var(--g5);line-height:1.7}

/* PHOTO GRID */
.photo-grid{padding:0 20px;columns:2;column-gap:8px;margin-bottom:14px}
.photo-card{break-inside:avoid;margin-bottom:8px;border-radius:8px;overflow:hidden;position:relative;background:var(--g2);animation:popIn .4s var(--ease) both}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.photo-card img{width:100%;display:block;object-fit:cover;cursor:pointer}
.photo-overlay{background:var(--g2);padding:8px 10px 10px}
.photo-cap-input{width:100%;background:transparent;border:none;border-bottom:.5px solid var(--g3);padding:4px 0;font-family:var(--serif);font-size:11px;font-style:italic;color:var(--g6);outline:none;transition:border-color .2s}
.photo-cap-input:focus{border-bottom-color:rgba(201,168,76,.5);color:var(--white)}
.photo-cap-input::placeholder{color:var(--g4)}
.photo-del{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.7);border:none;color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* JOURNAL NOTES */
.journal-section{padding:0 20px 14px}
.js-label{font-family:var(--mono);font-size:8px;letter-spacing:3px;color:var(--g5);text-transform:uppercase;margin-bottom:10px}
.js-textarea{width:100%;background:var(--g2);border:.5px solid var(--g3);border-radius:8px;padding:14px;font-family:var(--serif);font-size:15px;font-style:italic;color:var(--white);line-height:1.65;resize:none;min-height:96px;transition:border-color .2s;outline:none}
.js-textarea:focus{border-color:rgba(201,168,76,.5)}
.js-textarea::placeholder{color:var(--g4);font-style:italic}

/* MAP */
.map-section{padding:0 20px 14px}
.map-label{font-family:var(--mono);font-size:8px;letter-spacing:3px;color:var(--g5);text-transform:uppercase;margin-bottom:10px}
.map-container{border-radius:10px;overflow:hidden;border:.5px solid var(--g3);height:200px;background:var(--g2)}
.map-container iframe{width:100%;height:100%;border:none;filter:invert(1) hue-rotate(180deg) saturate(.7) brightness(.8)}
.map-pins{margin-top:10px}
.map-pin-row{display:flex;align-items:center;gap:8px}
.map-pin-input{flex:1;background:var(--g2);border:.5px solid var(--g3);border-radius:6px;padding:9px 11px;font-family:var(--sans);font-size:13px;color:var(--white);outline:none;transition:border-color .2s}
.map-pin-input:focus{border-color:rgba(201,168,76,.5)}
.map-pin-input::placeholder{color:var(--g4)}
.map-pin-add{padding:9px 14px;background:var(--gold);border:none;border-radius:6px;color:var(--black);font-family:var(--mono);font-size:10px;font-weight:bold;cursor:pointer;white-space:nowrap}
.pin-list{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.pin-tag{display:flex;align-items:center;gap:5px;background:var(--g3);border-radius:20px;padding:5px 10px;font-family:var(--mono);font-size:9px;color:var(--g6);border:.5px solid var(--g4)}
.pin-tag button{background:none;border:none;color:var(--g5);cursor:pointer;font-size:10px;line-height:1;padding:0}

/* DAY SUMMARY - manual */
.sum-section{padding:0 20px 22px}
.sum-label{font-family:var(--mono);font-size:8px;letter-spacing:3px;color:var(--g5);text-transform:uppercase;margin-bottom:10px}
.sum-textarea{width:100%;background:var(--g2);border:.5px solid var(--g3);border-radius:8px;padding:14px;font-family:var(--serif);font-size:15px;font-style:italic;color:var(--white);line-height:1.65;resize:none;min-height:80px;transition:border-color .2s;outline:none}
.sum-textarea:focus{border-color:rgba(201,168,76,.5)}
.sum-textarea::placeholder{color:var(--g4);font-style:italic}

/* SLIDESHOW */
#ss-overlay{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,.97);display:none;flex-direction:column;align-items:center;justify-content:center}
#ss-overlay.on{display:flex}
.ss-x{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--g5);font-size:24px;cursor:pointer;padding:8px;z-index:1}
.ss-img{max-width:100%;max-height:65dvh;object-fit:contain;border-radius:4px;padding:0 20px;animation:ssIn .5s var(--ease) both}
@keyframes ssIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.ss-cap{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--g6);text-align:center;margin-top:14px;padding:0 32px;line-height:1.5;max-width:340px;min-height:22px}
.ss-counter{font-family:var(--mono);font-size:9px;color:var(--g5);margin-top:6px;letter-spacing:2px}
.ss-controls{display:flex;gap:16px;margin-top:18px;align-items:center}
.ss-btn{width:40px;height:40px;border-radius:50%;border:.5px solid var(--g4);background:transparent;color:var(--white);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ss-btn:active{background:var(--g3)}
.ss-play{width:48px;height:48px;background:var(--gold);border-color:var(--gold);color:var(--black);font-size:18px}

/* JOURNAL VIEW */
#jv{position:fixed;inset:0;z-index:7000;background:var(--black);display:none;overflow-y:auto}
#jv.on{display:block}
.jv-top{background:var(--g1);padding:56px 24px 36px;text-align:center;border-bottom:.5px solid var(--g3);position:relative;overflow:hidden}
.jv-top::before{content:'BUDAPEST';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:80px;font-weight:600;font-style:italic;color:rgba(201,168,76,.04);white-space:nowrap;pointer-events:none}
.jv-kicker{font-family:var(--mono);font-size:8px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px;position:relative}
.jv-ttl{font-family:var(--serif);font-size:clamp(40px,13vw,70px);font-weight:300;line-height:.9;position:relative}
.jv-ttl em{font-style:italic;color:var(--gold);display:block;font-size:.44em;letter-spacing:4px;margin-top:10px}
.jv-meta{font-family:var(--mono);font-size:9px;color:var(--g5);margin-top:16px;position:relative}
.jv-rule{width:60px;height:.5px;background:var(--gold);margin:18px auto 0}
.jv-day{padding:28px 22px;border-bottom:.5px solid var(--g3)}
.jvd-kicker{font-family:var(--mono);font-size:8px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:7px}
.jvd-title{font-family:var(--serif);font-size:26px;font-weight:300;margin-bottom:3px}
.jvd-title em{font-style:italic;color:var(--gold)}
.jvd-date{font-family:var(--mono);font-size:9px;color:var(--g5);margin-bottom:14px}
.jvd-strip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.jvd-strip::-webkit-scrollbar{display:none}
.jvd-thumb{flex-shrink:0;width:100px;height:128px;border-radius:6px;overflow:hidden;position:relative}
.jvd-thumb img{width:100%;height:100%;object-fit:cover}
.jvd-thumb-cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.82));padding:14px 6px 6px;font-family:var(--serif);font-size:9px;font-style:italic;color:rgba(244,241,235,.85);line-height:1.3}
.jvd-note{font-family:var(--serif);font-size:14px;font-style:italic;color:var(--g6);line-height:1.75;margin-bottom:10px;padding-top:12px;border-top:.5px solid var(--g3)}
.jvd-sum{font-family:var(--serif);font-size:14px;font-style:italic;color:var(--white);line-height:1.8;opacity:.85}
.jv-back{display:block;margin:22px;padding:13px;border-radius:8px;border:.5px solid var(--g4);background:transparent;color:var(--g6);font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;text-align:center;width:calc(100% - 44px)}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:600;background:rgba(8,8,8,.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:.5px solid var(--g3);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bnav-btn{flex:1;padding:11px 6px;border-radius:8px;border:.5px solid var(--g3);background:transparent;color:var(--g6);font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.bnav-btn:active{background:var(--g2)}
.bnav-btn.gold{background:var(--gold);border-color:var(--gold);color:var(--black);font-weight:bold}
.bnav-btn.gold:active{background:var(--gold2)}

/* INSTALL TOAST */
.install-toast{position:fixed;bottom:82px;left:16px;right:16px;background:var(--g2);border:.5px solid rgba(201,168,76,.3);border-radius:12px;padding:14px 16px;display:none;align-items:center;gap:12px;z-index:700;animation:slideUp .3s var(--ease)}
.install-toast.on{display:flex}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.it-text{flex:1;font-family:var(--sans);font-size:12px;color:var(--white);line-height:1.4}
.it-btn{padding:7px 14px;background:var(--gold);border:none;border-radius:6px;color:var(--black);font-family:var(--mono);font-size:10px;font-weight:bold;cursor:pointer;white-space:nowrap}
.it-x{background:none;border:none;color:var(--g5);font-size:16px;cursor:pointer;padding:2px 5px}

.spin{width:12px;height:12px;border:1.5px solid rgba(201,168,76,.25);border-top-color:var(--gold);border-radius:50%;animation:spinning .6s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spinning{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loader">
  <div class="ld-flag">🇭🇺</div>
  <div class="ld-eyebrow">Travel Journal · May 2025</div>
  <div class="ld-title">Budapest<em>&amp; us</em></div>
  <div class="ld-rule"></div>
  <div class="ld-names">אריאל · אלה</div>
  <div class="ld-prog-wrap"><div class="ld-prog"></div></div>
</div>

<div id="ss-overlay">
  <button class="ss-x" onclick="ssClose()">✕</button>
  <img id="ss-img" src="" alt="" class="ss-img">
  <div id="ss-cap" class="ss-cap"></div>
  <div id="ss-ctr" class="ss-counter"></div>
  <div class="ss-controls">
    <button class="ss-btn" onclick="ssMove(-1)">←</button>
    <button class="ss-btn ss-play" id="ss-play" onclick="ssToggle()">▶</button>

</div>

<div id="jv">

</div>

<div class="install-toast" id="itx">
  <div class="it-text">התקן כאפליקציה על הנייד</div>
  <button class="it-btn" onclick="doInstall()">התקן</button>
  <button class="it-x" onclick="dismissInstall()">✕</button>
</div>

<div id="app">
  <div class="topbar">
    <div class="tb-logo">Buda<span>pest</span></div>
    <div class="tb-wpill" id="wpill"><span id="wp-icon">☁</span><span id="wp-temp">—°</span></div>
    <div class="tb-days">
      <div class="tb-d active" id="td-1" onclick="switchDay(1)">1</div>
      <div class="tb-d" id="td-2" onclick="switchDay(2)">2</div>
      <div class="tb-d" id="td-3" onclick="switchDay(3)">3</div>
      <div class="tb-d" id="td-4" onclick="switchDay(4)">4</div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-ghost">Budapest</div>
    <div class="hero-body">
      <div class="hero-kicker">Travel Journal · May 2025</div>
      <div class="hero-h1">אריאל<br><em>&amp; אלה</em></div>
      <div class="hero-byline">
        <span>בודפשט</span><div class="hero-rule"></div>
        <span>13–17 מאי</span><div class="hero-rule"></div>
        <span>4 לילות</span>
      </div>
    </div>
  </div>

  <div id="cd-area"></div>

  <div class="trip-prog">
    <div class="tp-head"><span>התקדמות הטיול</span><span id="tp-pct">0%</span></div>
    <div class="tp-track"><div class="tp-fill" id="tp-fill" style="width:0%"></div></div>
    <div class="tp-dates"><span>13.5</span><span>14.5</span><span>15.5</span><span>16.5</span><span>17.5</span></div>
  </div>

  <div class="weather-card">
    <div class="wc-icon" id="wc-icon">☁️</div>
    <div class="wc-body">
      <div class="wc-temp" id="wc-temp">—°C</div>
      <div class="wc-desc" id="wc-desc">טוען...</div>
    </div>
    <div class="wc-right" id="wc-right">לחות: —<br>רוח: —<br>בודפשט</div>
  </div>

  <div class="quote-strip">
    <div class="qs-text" id="qs-text"></div>
    <div class="qs-author" id="qs-author"></div>
  </div>

  <div class="stats-row">
    <div class="stat-cell"><div class="stat-n" id="s-photos">0</div><div class="stat-l">תמונות</div></div>
    <div class="stat-cell"><div class="stat-n" id="s-days">0</div><div class="stat-l">ימים</div></div>
    <div class="stat-cell"><div class="stat-n" id="s-pins">0</div><div class="stat-l">מקומות</div></div>
  </div>

  <div id="day-panels"></div>

  <div class="bottomnav">
    <button class="bnav-btn" onclick="ssOpen()">▶ Reel</button>
    <label class="bnav-btn gold" style="cursor:pointer">
      📷 הוסף<input type="file" accept="image/*" multiple style="display:none;font-size:16px" id="gfile" onchange="handleGlobal(this)">
    </label>
    <button class="bnav-btn" onclick="jvOpen()">📖 יומן</button>
  </div>
</div>

<script>
const DEPARTURE=new Date('2025-05-13T11:00:00');
const RETURN=new Date('2025-05-17T23:59:00');
const DATES=['13.5','14.5','15.5','16.5'];
const DAY_TITLES=['יום <em>ראשון</em> בבודפשט','לב <em>העיר</em>','פנינים <em>נסתרות</em>','יום <em>אחרון</em>'];
const DAY_DATES_FULL=['13 במאי, 2025','14 במאי, 2025','15 במאי, 2025','16 במאי, 2025'];
const QUOTES=[
  {t:'Budapest is a city of immense beauty, built on contradictions.',a:'— Claudio Magris'},
  {t:"The Danube doesn't divide Budapest. It defines it.",a:'— Patrick Leigh Fermor'},
  {t:'Every city has a sex and an age. Budapest is a woman in her thirties.',a:'— John Berger'},
  {t:'To walk in Budapest is to walk through history itself.',a:'— Anonymous'},
  {t:'In Budapest, the past is always present — written in stone and light.',a:'— Unknown traveler'}
];

let curDay=1, deferredPrompt=null, ssPhotos=[], ssIdx=0, ssInt=null;

const S={
  photos:{1:[],2:[],3:[],4:[]},
  notes:{1:'',2:'',3:'',4:''},
  summaries:{1:'',2:'',3:'',4:''},
  pins:{1:[],2:[],3:[],4:[]}
};

// ── STORAGE ───────────────────────────────────────
function save(){
  try{
    // Store everything including full base64 data
    const data={
      notes:S.notes,summaries:S.summaries,pins:S.pins,
      photos:{}
    };
    for(let d=1;d<=4;d++){
      data.photos[d]=S.photos[d].map(p=>({id:p.id,dataUrl:p.dataUrl,caption:p.caption}));
    }
    localStorage.setItem('bp-v4',JSON.stringify(data));
  }catch(e){
    // localStorage might be full — try saving without photos
    try{
      const data={notes:S.notes,summaries:S.summaries,pins:S.pins,photos:{}};
      for(let d=1;d<=4;d++) data.photos[d]=S.photos[d].map(p=>({id:p.id,dataUrl:p.dataUrl,caption:p.caption}));
      localStorage.setItem('bp-v4',JSON.stringify(data));
    }catch(e2){console.warn('Storage full')}
  }
}

function load(){
  try{
    const raw=localStorage.getItem('bp-v4');
    if(!raw)return;
    const d=JSON.parse(raw);
    S.notes=d.notes||{1:'',2:'',3:'',4:''};
    S.summaries=d.summaries||{1:'',2:'',3:'',4:''};
    S.pins=d.pins||{1:[],2:[],3:[],4:[]};
    for(let i=1;i<=4;i++){
      S.photos[i]=(d.photos?.[i]||[]).map(p=>({...p}));
    }
  }catch(e){}
}

// ── INIT ──────────────────────────────────────────
window.addEventListener('load',()=>{
  load();
  setTimeout(()=>{
    document.getElementById('loader').classList.add('out');
    document.getElementById('app').classList.add('visible');
    buildPanels();updateTabs();showDay(1);
    renderCD();renderProgress();fetchWeather();renderQuote();updateStats();
    if('serviceWorker'in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;setTimeout(maybeInstall,5000)});
  },2800);
});

// ── COUNTDOWN ─────────────────────────────────────
function renderCD(){
  const area=document.getElementById('cd-area');
  const now=new Date();
  if(now>=DEPARTURE&&now<=RETURN){area.innerHTML='<div class="cd-active">✈ הטיול מתחיל עכשיו — בודפשט מחכה לנו!</div>';return}
  if(now>RETURN){area.innerHTML='<div class="cd-active">🧳 הטיול הסתיים — הזיכרונות נשארים לנצח</div>';return}
  const diff=DEPARTURE-now;
  const dd=Math.floor(diff/86400000),hh=Math.floor((diff%86400000)/3600000),mm=Math.floor((diff%3600000)/60000),ss=Math.floor((diff%60000)/1000);
  area.innerHTML=`<div class="countdown"><div class="cd-label">ספירה לאחור לטיסה · ✈ יום רביעי 13.5 בשעה 11:00</div><div class="cd-nums"><div class="cd-unit"><div class="cd-n" id="cd-d">${p2(dd)}</div><div class="cd-u">ימים</div></div><div class="cd-col">:</div><div class="cd-unit"><div class="cd-n" id="cd-h">${p2(hh)}</div><div class="cd-u">שעות</div></div><div class="cd-col">:</div><div class="cd-unit"><div class="cd-n" id="cd-m">${p2(mm)}</div><div class="cd-u">דקות</div></div><div class="cd-col">:</div><div class="cd-unit"><div class="cd-n" id="cd-s">${p2(ss)}</div><div class="cd-u">שניות</div></div></div></div>`;
  setInterval(tickCD,1000);
}
function tickCD(){
  const diff=DEPARTURE-new Date();if(diff<=0){renderCD();return}
  const dd=Math.floor(diff/86400000),hh=Math.floor((diff%86400000)/3600000),mm=Math.floor((diff%3600000)/60000),ss=Math.floor((diff%60000)/1000);
  setN('cd-d',dd);setN('cd-h',hh);setN('cd-m',mm);setN('cd-s',ss);
}
function setN(id,v){const el=document.getElementById(id);if(!el)return;const s=p2(v);if(el.textContent!==s){el.textContent=s;el.classList.add('tick');setTimeout(()=>el.classList.remove('tick'),280)}}
function p2(n){return String(n).padStart(2,'0')}

function renderProgress(){
  const now=new Date();let pct=0;
  if(now>=DEPARTURE){pct=Math.round(Math.min((now-DEPARTURE)/(RETURN-DEPARTURE),1)*100)}
  document.getElementById('tp-fill').style.width=pct+'%';
  document.getElementById('tp-pct').textContent=pct+'%';
}

// ── WEATHER ───────────────────────────────────────
async function fetchWeather(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.4979&longitude=19.0402&current=temperature_2m,weathercode,windspeed_10m,relativehumidity_2m&timezone=Europe%2FBudapest');
    const d=await r.json();const c=d.current;
    const icon=wmoIcon(c.weathercode),desc=wmoDesc(c.weathercode);
    document.getElementById('wc-icon').textContent=icon;
    document.getElementById('wc-temp').textContent=Math.round(c.temperature_2m)+'°C';
    document.getElementById('wc-desc').textContent=desc;
    document.getElementById('wc-right').innerHTML=`לחות: ${c.relativehumidity_2m}%<br>רוח: ${Math.round(c.windspeed_10m)} km/h<br>בודפשט`;
    document.getElementById('wp-icon').textContent=icon;
    document.getElementById('wp-temp').textContent=Math.round(c.temperature_2m)+'°';
  }catch(e){document.getElementById('wc-desc').textContent='לא ניתן לטעון'}
}
function wmoIcon(c){if(c===0)return'☀️';if(c<=2)return'⛅';if(c<=3)return'☁️';if(c<=49)return'🌫️';if(c<=59)return'🌦️';if(c<=69)return'🌧️';if(c<=79)return'❄️';if(c<=82)return'🌦️';if(c<=99)return'⛈️';return'🌡️'}
function wmoDesc(c){if(c===0)return'שמיים בהירים';if(c<=2)return'מעונן חלקית';if(c<=3)return'מעונן';if(c<=49)return'ערפל';if(c<=59)return'גשם קל';if(c<=69)return'גשם';if(c<=79)return'שלג';if(c<=82)return'גשם מקלחת';if(c<=99)return'סופת רעמים';return'לא ידוע'}

function renderQuote(){const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];document.getElementById('qs-text').textContent=q.t;document.getElementById('qs-author').textContent=q.a}

// ── DAY PANELS ────────────────────────────────────
function buildPanels(){
  const c=document.getElementById('day-panels');c.innerHTML='';
  for(let d=1;d<=4;d++){
    const sec=document.createElement('div');sec.className='day-section';sec.id='ds-'+d;
    sec.innerHTML=`
<div class="day-header">
  <div class="dh-ghost">${d}</div>
  <div class="dh-kicker">יום ${d} · ${DATES[d-1]}</div>
  <div class="dh-title">${DAY_TITLES[d-1]}</div>
  <div class="dh-date">${DAY_DATES_FULL[d-1]}</div>
  <div class="dh-count" id="dhc-${d}"></div>
</div>
<label class="upload-zone">
  <input type="file" accept="image/*" multiple onchange="handlePhotos(${d},this)" style="font-size:16px">
  <div class="uz-icon">📷</div>
  <div class="uz-text">הוסף תמונות מיום ${d} — <strong>לחץ כאן</strong></div>
</label>
<div class="empty-state on" id="empty-${d}">
  <div class="es-icon">🌆</div>
  <div class="es-title">יום ${d} מחכה לתמונות</div>
  <div class="es-sub">העלה תמונות<br>ותוכל לכתוב כיתוב לכל אחת</div>
</div>
<div class="photo-grid" id="pg-${d}"></div>
<div class="journal-section">
  <div class="js-label">הערות יומן</div>
  <textarea class="js-textarea" id="note-${d}" placeholder="מה קרה היום? מה הרגשתם? מה לא תשכחו?..." onchange="saveNote(${d})">${S.notes[d]||''}</textarea>
</div>
<div class="map-section">
  <div class="map-label">מקומות שביקרנו</div>
  <div class="map-container">
    <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=18.9,47.45,19.12,47.56&layer=mapnik" loading="lazy" title="Budapest"></iframe>
  </div>
  <div class="map-pins">
    <div class="map-pin-row">
      <input class="map-pin-input" id="pi-${d}" placeholder="שם המקום..." type="text" onkeydown="if(event.key==='Enter')addPin(${d})">
      <button class="map-pin-add" onclick="addPin(${d})">+ הוסף</button>
    </div>
    <div class="pin-list" id="pl-${d}"></div>
  </div>
</div>
<div class="sum-section">
  <div class="sum-label">סיכום היום</div>
  <textarea class="sum-textarea" id="sum-${d}" placeholder="כתוב כאן את הסיכום של היום..." onchange="saveSum(${d})">${S.summaries[d]||''}</textarea>
</div>`;
    c.appendChild(sec);
    for(const p of S.photos[d]) renderCard(d,p,false);
    for(const pin of S.pins[d]) renderPin(d,pin);
    updateCount(d);updateEmpty(d);
  }
}

function showDay(d){
  document.querySelectorAll('.day-section').forEach((s,i)=>s.classList.toggle('active',i===d-1));
  curDay=d;
  document.querySelectorAll('.tb-d').forEach((t,i)=>t.classList.toggle('active',i===d-1));
}
function switchDay(d){showDay(d)}
function updateTabs(){for(let d=1;d<=4;d++){const t=document.getElementById('td-'+d);if(t)t.classList.toggle('has',S.photos[d].length>0)}}
function updateCount(d){const el=document.getElementById('dhc-'+d);if(el)el.textContent=S.photos[d].length>0?S.photos[d].length+' תמונות':''}
function updateEmpty(d){const el=document.getElementById('empty-'+d);if(el)el.classList.toggle('on',S.photos[d].length===0)}
function updateStats(){
  document.getElementById('s-photos').textContent=[1,2,3,4].reduce((a,d)=>a+S.photos[d].length,0);
  document.getElementById('s-days').textContent=[1,2,3,4].filter(d=>S.photos[d].length>0).length;
  document.getElementById('s-pins').textContent=[1,2,3,4].reduce((a,d)=>a+S.pins[d].length,0);
}

// ── PHOTOS — save as dataUrl (base64) so they persist ──
async function handlePhotos(day,input){
  const files=Array.from(input.files);if(!files.length)return;
  for(const file of files){
    const dataUrl=await toDataUrl(file);
    const id=Date.now()+'-'+Math.random().toString(36).slice(2);
    const photo={id,dataUrl,caption:''};
    S.photos[day].push(photo);
    renderCard(day,photo,true);
    updateCount(day);updateTabs();updateEmpty(day);updateStats();
    save();
  }
  input.value='';
}
function handleGlobal(input){handlePhotos(curDay,input)}

function renderCard(day,photo,anim){
  const grid=document.getElementById('pg-'+day);if(!grid)return;
  const div=document.createElement('div');
  div.className='photo-card';
  if(!anim)div.style.animation='none';
  div.id='pc-'+photo.id;
  div.innerHTML=`
    <img src="${photo.dataUrl}" alt="" loading="lazy" onclick="ssOpenPhoto(${day},'${photo.id}')">
    <button class="photo-del" onclick="delPhoto(${day},'${photo.id}')">✕</button>
    <div class="photo-overlay">
      <input class="photo-cap-input" placeholder="כתוב כיתוב..." value="${(photo.caption||'').replace(/"/g,'&quot;')}"
        onchange="updateCaption(${day},'${photo.id}',this.value)"
        onclick="event.stopPropagation()">
    </div>`;
  grid.appendChild(div);
}

function updateCaption(day,id,val){
  const p=S.photos[day].find(p=>p.id===id);
  if(p){p.caption=val;save()}
}

function delPhoto(day,id){
  S.photos[day]=S.photos[day].filter(p=>p.id!==id);
  const el=document.getElementById('pc-'+id);
  if(el){el.style.cssText='opacity:0;transform:scale(.9);transition:all .2s';setTimeout(()=>el.remove(),200)}
  updateCount(day);updateTabs();updateEmpty(day);updateStats();save();
}

// ── NOTES & SUMMARY ───────────────────────────────
function saveNote(day){S.notes[day]=document.getElementById('note-'+day)?.value||'';save()}
function saveSum(day){S.summaries[day]=document.getElementById('sum-'+day)?.value||'';save()}

// ── PINS ──────────────────────────────────────────
function addPin(day){
  const input=document.getElementById('pi-'+day);
  const val=input?.value?.trim();if(!val)return;
  S.pins[day].push(val);renderPin(day,val);
  input.value='';updateStats();save();
}
function renderPin(day,name){
  const list=document.getElementById('pl-'+day);if(!list)return;
  const tag=document.createElement('div');tag.className='pin-tag';
  tag.innerHTML=`📍 ${name}<button onclick="rmPin(${day},'${name.replace(/'/g,"\\'")}',this)">✕</button>`;
  list.appendChild(tag);
}
function rmPin(day,name,btn){
  S.pins[day]=S.pins[day].filter(p=>p!==name);
  btn.closest('.pin-tag').remove();updateStats();save();
}

// ── SLIDESHOW ─────────────────────────────────────
function ssOpenPhoto(day,startId){
  ssPhotos=S.photos[day].filter(p=>p.dataUrl);
  ssIdx=ssPhotos.findIndex(p=>p.id===startId);
  if(ssIdx<0)ssIdx=0;
  if(!ssPhotos.length)return;
  document.getElementById('ss-overlay').classList.add('on');ssRender();
}
function ssOpen(){
  ssPhotos=[1,2,3,4].flatMap(d=>S.photos[d]).filter(p=>p.dataUrl);
  if(!ssPhotos.length){alert('הוסף תמונות קודם');return}
  ssIdx=0;document.getElementById('ss-overlay').classList.add('on');ssRender();
}
function ssClose(){
  document.getElementById('ss-overlay').classList.remove('on');
  if(ssInt){clearInterval(ssInt);ssInt=null}
  document.getElementById('ss-play').textContent='▶';
}
function ssRender(){
  const p=ssPhotos[ssIdx];
  const img=document.getElementById('ss-img');
  img.style.animation='none';img.offsetWidth;
  img.style.animation='ssIn .5s cubic-bezier(0.16,1,0.3,1) both';
  img.src=p.dataUrl;
  document.getElementById('ss-cap').textContent=p.caption||'';
  document.getElementById('ss-ctr').textContent=(ssIdx+1)+' / '+ssPhotos.length;
}
function ssMove(dir){ssIdx=(ssIdx+dir+ssPhotos.length)%ssPhotos.length;ssRender()}
function ssToggle(){
  if(ssInt){clearInterval(ssInt);ssInt=null;document.getElementById('ss-play').textContent='▶'}
  else{ssInt=setInterval(()=>ssMove(1),3000);document.getElementById('ss-play').textContent='⏸'}
}

// ── JOURNAL VIEW ──────────────────────────────────
function jvOpen(){
  const total=[1,2,3,4].reduce((a,d)=>a+S.photos[d].length,0);
  if(!total){alert('הוסף תמונות לפחות ליום אחד');return}
  const content=document.getElementById('jv-content');
  let html=`<div class="jv-top"><div class="jv-kicker">Travel Journal · May 2025</div><div class="jv-ttl">Budapest<em>אריאל ואלה</em></div><div class="jv-meta">13–17 במאי · 4 לילות · בודפשט, הונגריה</div><div class="jv-rule"></div></div>`;
  for(let d=1;d<=4;d++){
    if(!S.photos[d].length&&!S.notes[d]&&!S.summaries[d])continue;
    html+=`<div class="jv-day"><div class="jvd-kicker">יום ${d} · ${DATES[d-1]}</div><div class="jvd-title">${DAY_TITLES[d-1]}</div><div class="jvd-date">${DAY_DATES_FULL[d-1]}</div>`;
    if(S.photos[d].length){
      html+='<div class="jvd-strip">';
      for(const p of S.photos[d]) html+=`<div class="jvd-thumb"><img src="${p.dataUrl}" alt=""><div class="jvd-thumb-cap">${p.caption||''}</div></div>`;
      html+='</div>';
    }
    if(S.notes[d]) html+=`<div class="jvd-note">${S.notes[d]}</div>`;
    if(S.summaries[d]) html+=`<div class="jvd-sum">${S.summaries[d]}</div>`;
    html+='</div>';
  }
  content.innerHTML=html;
  document.getElementById('jv').classList.add('on');
}
function jvClose(){document.getElementById('jv').classList.remove('on')}

// ── PWA INSTALL ───────────────────────────────────
function maybeInstall(){if(deferredPrompt&&!localStorage.getItem('bp-install-d'))document.getElementById('itx').classList.add('on')}
function doInstall(){document.getElementById('itx').classList.remove('on');if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null})}}
function dismissInstall(){document.getElementById('itx').classList.remove('on');localStorage.setItem('bp-install-d','1')}

// ── UTILS ─────────────────────────────────────────
function toDataUrl(file){
  return new Promise((res,rej)=>{
    // Resize image before saving to save localStorage space
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const MAX=800;
        let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        res(canvas.toDataURL('image/jpeg',0.75));
      };
      img.src=e.target.result;
    };
    reader.onerror=rej;
    reader.readAsDataURL(file);
  });
}
</script>
</body>
</html>
